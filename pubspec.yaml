name: GreenCare
description: "A Farmer Advisory System"
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  weather: ^3.1.1
  intl: ^0.19.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.0.0 # Ensure the version is compatible with other packages
  firebase_core: ^3.9.0

dev_dependencies:
